# Complete example. Requires an exact isc -> Red Portal CubeMain recipe.
# Use the Level IDs and stat IDs from your effective mod data.
config_version = 1
enabled = true
random_salt = "native-mapping"

[hud]
enabled = true
density_text = "Monster Density: {value}%"
overflow_text = "+{value} more"
max_lines = 16

[traits.player_magic_find]
weight = 100
text = "Player Magic Find {signed}%"
stats = [
  { stat = "item_magicbonus", stat_id = 80, value = { min = 25, max = 150, step = 25 }, target = "player" }
]

[traits.player_gold_find]
weight = 100
text = "Player Extra Gold {signed}%"
stats = [
  { stat = "item_goldbonus", stat_id = 79, value = { min = 50, max = 150, step = 25 }, target = "player" }
]

[traits.monster_move_speed]
weight = 100
text = "Monster Walk/Run Speed {signed}%"
stats = [
  { stat = "velocitypercent", stat_id = 67, value = { min = 10, max = 30, step = 5 }, target = "monster" }
]

[traits.player_all_skills]
weight = 100
text = "Player All Skills {signed}"
stats = [
  { stat = "item_allskills", stat_id = 127, value = { min = 1, max = 2, step = 1 }, target = "player" }
]

[traits.player_maximum_mana]
weight = 100
text = "Player Maximum Mana {signed}%"
stats = [
  { stat = "item_maxmana_percent", stat_id = 77, value = { min = 10, max = 30, step = 5 }, target = "player" }
]

[traits.player_mana_regeneration]
weight = 100
