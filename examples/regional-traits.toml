  { stat = "damagepercent", stat_id = 25, value = { min = 20, max = 50, step = 10 }, target = "monster" }
]

[traits.monster_maximum_life]
weight = 100
text = "Monster Maximum Life {signed}%"
stats = [
  { stat = "item_maxhp_percent", stat_id = 76, value = { min = 10, max = 30, step = 5 }, target = "monster" }
]

[traits.player_all_resistance]
weight = 100
text = "Player All Resistances {signed0}%"
stats = [
  { stat = "fireresist", stat_id = 39, value = { min = 10, max = 30, step = 5 }, target = "player", roll_group = "all_res" },
  { stat = "lightresist", stat_id = 41, value = { min = 10, max = 30, step = 5 }, target = "player", roll_group = "all_res" },
  { stat = "coldresist", stat_id = 43, value = { min = 10, max = 30, step = 5 }, target = "player", roll_group = "all_res" },
  { stat = "poisonresist", stat_id = 45, value = { min = 10, max = 30, step = 5 }, target = "player", roll_group = "all_res" }
]

[traits.monster_fire_damage]
weight = 100
text = "Monster Added Fire Damage {value0}-{value1}"
stats = [
  { stat = "firemindam", stat_id = 48, value = { min = 10, max = 20, step = 5 }, target = "monster" },
  { stat = "firemaxdam", stat_id = 49, value = { min = 30, max = 50, step = 10 }, target = "monster" }
]

[traits.monster_fire_pierce]
weight = 100
text = "Monster Enemy Fire Resistance -{value}%"
stats = [
  { stat = "passive_fire_pierce", stat_id = 333, value = { min = 5, max = 15, step = 5 }, target = "monster" }
]

[traits.monster_life_replenish]
weight = 100
text = "Monster Replenish Life {signed}"
stats = [
  { stat = "hpregen", stat_id = 74, value = { min = 5, max = 15, step = 5 }, target = "monster" }
]

[traits.monster_conviction]
weight = 100
text = "Monster Aura: Conviction Lv.{value0}"
monster_aura = { skill = "conviction", skill_id = 123, level = 10 }

[cube_routes.identify_scroll]
inputs = ["isc"]
tier = "tier1"

[tiers.tier1]
trait_count = { min = 2, max = 2 }
base_stats = [
  { stat = "item_maxhp_percent", stat_id = 76, value = 50, target = "monster", text = "Monster Maximum Life {signed}%" }
]

[tiers.tier1.groups.act1_pit]
weight = 200
levels = [12, 16]
entrances = [{ level = 12, weight = 100 }]
density = 150
trait_pool = ["player_magic_find", "player_gold_find", "monster_move_speed"]

[tiers.tier1.groups.act2_arcane_sanctuary]
weight = 100
levels = [74]
entrances = [{ level = 74, weight = 100 }]
