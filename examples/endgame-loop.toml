# Requires custom nm1/nm2/nm3 items and exact Red Portal CubeMain recipes.
# Define Mapping_Tier1 and Mapping_Tier2 in TreasureClassEx before enabling.
# Tier-specific rewards require a separate monstats.txt configuration.
# Edit this file inside the d2rl-native-mapping.mpq folder beside the plugin DLL:
# data/global/excel/d2rloader/native-mapping/monstats.txt
# For skeleton1, set TreasureClass, TreasureClass(N) and TreasureClass(H) to
# Mapping_Tier1 in tier1 and Mapping_Tier2 in tier2.
# This changes normal-monster rewards in Normal, Nightmare and Hell.
# Other drop categories keep their original TC fields.
# Levels and stats below are illustrative; use effective mod data.
config_version = 1

[traits.hunters]
text = "Hunters: monster movement {signed0}%, Magic Find {signed1}%"
stats = [
  { stat_id = 67, target = "monster", value = 20 },
  { stat_id = 80, target = "player", value = 50 }
]
[traits.armored]
text = "Armored: monster physical resist {signed0}%, experience {signed1}%"
stats = [
  { stat_id = 36, target = "monster", value = 10 },
  { stat_id = 85, target = "player", value = 20 }
]

[cube_routes.tier1]
inputs = ["nm1"]
tier = "tier1"

[cube_routes.tier2]
inputs = ["nm2"]
tier = "tier2"

[cube_routes.tier3]
inputs = ["nm3"]
tier = "tier3"

[tiers.tier1]
difficulty_rank = 1
trait_count = { min = 1, max = 1 }
base_stats = [
  { stat_id = 39, target = "monster", value = 0, text = "Tier Monster All Resistances {signed}%" },
  { stat_id = 41, target = "monster", value = 0 },
  { stat_id = 43, target = "monster", value = 0 },
  { stat_id = 45, target = "monster", value = 0 },
]

[tiers.tier1.groups.route1]
levels = [2]
entrances = [{ level = 2, weight = 1 }]
density = 150
trait_pool = ["hunters", "armored"]

[tiers.tier1.groups.route1.monsters.2]
nummon = 1
mon = ["skeleton1"]
nmon = ["skeleton1"]
umon = ["skeleton1"]

[tiers.tier1.groups.route2]
levels = [3]
entrances = [{ level = 3, weight = 1 }]
density = 150
trait_pool = ["hunters", "armored"]

[tiers.tier1.groups.route2.monsters.3]
nummon = 1
mon = ["skeleton1"]
nmon = ["skeleton1"]
umon = ["skeleton1"]

[tiers.tier2]
difficulty_rank = 2
trait_count = { min = 1, max = 1 }
base_stats = [
  { stat_id = 39, target = "monster", value = 5, text = "Tier Monster All Resistances {signed}%" },
  { stat_id = 41, target = "monster", value = 5 },
  { stat_id = 43, target = "monster", value = 5 },
  { stat_id = 45, target = "monster", value = 5 },
]

[tiers.tier2.groups.route1]
levels = [8, 9]
entrances = [{ level = 8, weight = 1 }]
density = 200
trait_pool = ["hunters", "armored"]

[tiers.tier2.groups.route1.monsters.8]
nummon = 1
mon = ["skeleton1"]
nmon = ["skeleton1"]
umon = ["skeleton1"]

[tiers.tier2.groups.route1.monsters.9]
nummon = 1
mon = ["skeleton1"]
nmon = ["skeleton1"]
umon = ["skeleton1"]

[tiers.tier2.groups.route2]
levels = [10]
entrances = [{ level = 10, weight = 1 }]
density = 200
trait_pool = ["hunters", "armored"]

[tiers.tier2.groups.route2.monsters.10]
nummon = 1
mon = ["skeleton1"]
nmon = ["skeleton1"]
umon = ["skeleton1"]

[tiers.tier3]
difficulty_rank = 3
trait_count = { min = 1, max = 1 }
base_stats = [
  { stat_id = 39, target = "monster", value = 10, text = "Tier Monster All Resistances {signed}%" },
  { stat_id = 41, target = "monster", value = 10 },
  { stat_id = 43, target = "monster", value = 10 },
  { stat_id = 45, target = "monster", value = 10 },
]

[tiers.tier3.groups.route1]
levels = [21, 22, 23]
entrances = [{ level = 21, weight = 1 }]
density = 250
trait_pool = ["hunters", "armored"]

[tiers.tier3.groups.route2]
