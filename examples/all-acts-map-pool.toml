# Cube input for tier 1. Requires a matching red-portal cube recipe.
[cube_routes.tier1_isc]
inputs = ["isc"]
tier = "tier1"

# base_stats always apply; trait_count controls the number of random modifiers.
[tiers.tier1]
difficulty_rank = 1
trait_count = { min = 1, max = 10 }
base_stats = [
  { stat = "item_maxhp_percent", stat_id = 76, value = 50, target = "monster", text = "Monster Maximum Life {signed}%" }
]

# Map groups. Density 100 is normal; 200 is double.
[tiers.tier1.groups.act1_pit]
weight = 100
levels = [12, 16]
entrances = [{ level = 12, weight = 100 }]
density = { min = 100, max = 1000, step = 1 }
trait_pool = [
  "monster_attack_speed", "monster_move_speed", "monster_cast_speed",
  "monster_conviction", "player_magic_find", "player_attack_speed", "player_move_speed",
  "player_cast_speed", "player_all_resistance", "monster_all_resistance",
  "player_physical_resistance", "player_experience",
  "monster_damage", "monster_attack_rating", "monster_defense",
  "monster_hit_recovery", "monster_magic_resistance", "player_damage",
  "player_attack_rating", "player_defense", "player_hit_recovery",
  "player_magic_resistance", "monster_physical_resistance", "player_block_speed",
  "player_maximum_life", "player_maximum_mana", "player_mana_regeneration",
  "player_life_replenish", "player_life_steal", "player_mana_steal",
