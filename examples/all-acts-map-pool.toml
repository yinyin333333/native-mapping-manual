# Complete example: 25 map groups and 83 player / monster traits.
# Requires an exact isc -> Red Portal CubeMain recipe.
# Native Mapping configuration
# Restart the game after saving changes.

config_version = 1
enabled = true
random_salt = "native-mapping"

# On-screen map information.
[hud]
enabled = true
density_text = "Monster Density: {value}%"
overflow_text = "+{value} more"
max_lines = 16

# Map modifiers. Higher weight makes a modifier more likely to be selected.
[traits.monster_attack_speed]
weight = 100
text = "Monster Attack Speed {signed0}%"
stats = [
  { stat = "attackrate", stat_id = 68, value = { min = 10, max = 30, step = 5 }, target = "monster", roll_group = "speed" },
  { stat = "other_animrate", stat_id = 69, value = { min = 10, max = 30, step = 5 }, target = "monster", roll_group = "speed" }
]

